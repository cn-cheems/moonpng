name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  moonbit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: Show versions
        run: moon version --all
      - name: Check
        run: moon check --target all --deny-warn
      - name: Test
        run: moon test --target all --deny-warn
      - name: Build browser workbench
        if: runner.os == 'Linux'
        run: moon build cmd/web --target js --release --deny-warn
      - name: Run compression benchmark
        if: runner.os == 'Linux'
        run: moon run cmd/bench --target native --release
      - name: Verify generated interfaces and formatting
        shell: bash
        run: |
          moon info
          moon fmt
          git diff --exit-code
